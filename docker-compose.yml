version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ticketiq-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ticketiq
      MYSQL_USER: ticketiq_user
      MYSQL_PASSWORD: ticketiq_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:latest
    container_name: ticketiq-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mysql_data:
  mongodb_data:
